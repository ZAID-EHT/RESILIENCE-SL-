[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-sl"
version = "2.0.0"
description = "Evidence-Based Rainfall-Forecast Reliability and Historical Flood Exposure for the Kelani Catchment, Sri Lanka"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RESILIENCE SL Research Team" }
]
keywords = ["meteorology", "flood-exposure", "kelani-catchment", "sri-lanka", "ecmwf", "chirps", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pydeck>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
